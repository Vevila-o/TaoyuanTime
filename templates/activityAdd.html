{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增活動</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'css/activityAdd.css' %}">
</head>
<body>
  {% include "adminSidebar.html" with active_page="activities" %}
  <div class="main-content">
    <div class="topbar">
      <h5><i class="bi bi-plus-circle"></i> 新增活動</h5>
      <a href="{% url 'activityList' %}" class="btn-back">返回活動列表</a>
    </div>
    <form method="post" class="form-card">
      {% csrf_token %}
      {% include "activityFormFields.html" %}
      <div class="form-actions">
        <a href="{% url 'activityList' %}" class="btn-cancel">取消</a>
        <button class="btn-save" type="submit">儲存活動</button>
      </div>
    </form>
  </div>
</body>
</html>
